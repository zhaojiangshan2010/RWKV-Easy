# ============================================================
# RWKV-7 LoRA + infinite context（分块训练超长样本）
#
#   rwkv-easy train -c configs/lora_sharegpt_infctx.yaml
#
# 每个样本仍然是 ctx_len 长，但前向以 chunk_ctx 为块推进，
# 块之间传递循环状态。显存只与 chunk_ctx 成正比。
# ============================================================

run:
  name: rwkv7-lora-infctx
  output_dir: runs
  seed: 42

model:
  path: models/rwkv7-g1d-0.4b.pth
  decay: auto
  backend: fla                         # 推荐 CUDA + rwkv-fla；没有就改 native
  wkv_chunk: 64

train:
  method: lora
  infctx: true
  ctx_len: 8192                         # 总长度
  chunk_ctx: 2048                       # 显存单位；2048 在 0.1B/0.4B 上效率最高
  micro_batch_size: 1
  grad_accum: 16
  epochs: 1
  lr: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 20
  lr_schedule: cosine
  precision: bf16-full                  # 基座 bf16，LoRA 参数仍是 fp32
  grad_checkpoint: false                # 每块即时反传后，通常不再需要重计算
  infctx_detach: true                   # 块间截断梯度（省显存）
  infctx_backward: true                 # 每块立即 backward，显存 ∝ chunk_ctx
  compile: true                         # 编译训练前向；首次启动慢
  compile_mode: default
  log_every: 10
  save_every_steps: 500
  save_every_epochs: 1
  keep_last: 2
  merge_at_end: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - att.receptance
    - att.key
    - att.value
    - att.output
    - ffn.key
    - ffn.value

data:
  path: data/sharegpt.json
  mode: packed                         # infctx 需要定长、无 padding
  template: rwkv_world
  train_on: assistant
  append_eos: end
  num_workers: 2
  num_proc: 4

dist:
  mode: auto
  num_gpus: auto

log:
  jsonl: true
  wandb: false
