# ============================================================
# RWKV-7 LoRA 微调（推荐入门配置）
#
#   rwkv-easy train -c configs/lora_sharegpt.yaml
#
# 单卡直接跑；检测到多张 GPU 时会自动用 DDP 启动。
# ============================================================

run:
  name: rwkv7-lora
  output_dir: runs
  seed: 42

model:
  path: models/rwkv7-g1d-0.4b.pth      # ← 改成你的 RWKV-7 权重
  decay: auto                          # auto = 用校准文本自动判断衰减公式
  backend: native                      # native = 纯 PyTorch，CPU/CUDA/ROCm 通用
                                       # CUDA 上想更快可改 fla（见 lora_sharegpt_fla.yaml）
  wkv_chunk: 64

train:
  method: lora
  infctx: false
  ctx_len: 2048
  chunk_ctx: 512                       # 仅 infctx 使用
  micro_batch_size: 2
  grad_accum: 8
  epochs: 1
  lr: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 20
  lr_schedule: cosine
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16-full                 # GPU 推荐：基座 bf16，LoRA 仍是 fp32
                                       # 其它：fp32 / fp16 / bf16（CPU 必须 fp32）
  grad_checkpoint: true                # 0.1B/显存充足时可关，速度约 +20%
  log_every: 10
  save_every_steps: 500
  save_every_epochs: 1
  keep_last: 2
  merge_at_end: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - att.receptance
    - att.key
    - att.value
    - att.output
    - ffn.key
    - ffn.value

data:
  path: data/sharegpt.json             # ← 改成你的 ShareGPT 数据集
  mode: packed                         # packed 兼容 infctx；sample 仅非 infctx
  template: rwkv_world
  train_on: assistant
  append_eos: end
  val_ratio: 0.0
  num_workers: 2
  num_proc: 4

dist:
  mode: auto                           # auto / single / ddp / deepspeed
  num_gpus: auto

log:
  jsonl: true
  wandb: false
